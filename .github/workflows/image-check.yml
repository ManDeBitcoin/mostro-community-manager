name: Check image
# Builds and smoke-tests the image a pull request would ship, without
# publishing anything. The same build only ran on release tags before, so a
# broken Dockerfile was first seen after the tag existed.
on:
  pull_request:
    branches: [main]
    paths:
      - 'api/**'
      - 'web/**'
      - 'docker/**'
      - 'config/**'
      - 'scripts/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.dockerignore'
      - '.github/workflows/image-check.yml'
  # Also on main, so pull requests start from its build cache instead of cold.
  push:
    branches: [main]
    paths:
      - 'api/**'
      - 'web/**'
      - 'docker/**'
      - 'config/**'
      - 'scripts/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.dockerignore'
      - '.github/workflows/image-check.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: image-check-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    env:
      IMAGE: mostro-community-manager:check-${{ matrix.arch }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069
      - name: Test release tooling
        run: python3 -m unittest discover -s scripts/tests
      - name: Build native image (including Rust checks)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/${{ matrix.arch }}
          build-args: |
            MANAGER_VERSION=v0.0.0-check
          load: true
          push: false
          tags: ${{ env.IMAGE }}
          cache-from: type=gha,scope=manager-check-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=manager-check-${{ matrix.arch }}
      - name: Test container and persistence
        run: ./scripts/container-smoke.sh "$IMAGE"
      - name: Verify read-only LND TLS adapter in container
        run: python3 scripts/lnd-smoke.py --image "$IMAGE"
      - name: Verify optional Mostro image without starting daemon
        run: bash scripts/verify-mostro-image.sh
