[package]
name = "mostro-community-api"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"

[dependencies]
axum = "0.8.8"
tokio = { version = "1.50", features = ["macros", "rt-multi-thread", "net", "signal", "fs", "io-util", "sync"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8.23"
url = "2.5"
reqwest = { version = "0.12.28", default-features = false, features = ["native-tls-vendored", "json"] }
tonic = { version = "0.12.3", features = ["transport"] }
prost = "0.13.5"
tower-http = { version = "0.6.11", features = ["fs", "set-header"] }
nostr = { version = "0.44.4", default-features = false, features = ["std", "nip04", "nip44", "nip59"] }
rpassword = "7"
zeroize = "1"
tempfile = "3"
age = "=0.12.1"
qrcode = { version = "0.14.1", default-features = false, features = ["svg"] }
sha2 = "0.10"
# Session tokens of the panel login.
getrandom = "0.2"
# The daemon's SQLite database: consistent copies for backups, open orders.
rusqlite = { version = "0.40.2", features = ["bundled", "backup"] }
tokio-tungstenite = { version = "0.26.2", features = ["native-tls-vendored"] }
futures-util = "0.3.30"

[build-dependencies]
tonic-build = "0.12.3"
protoc-bin-vendored = "3.2"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
